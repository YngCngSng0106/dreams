server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/dream_share?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

dream:
  jwt:
    secret: DreamShareJwtSecretKey2026YangChangSong
    expiration: 86400
  upload:
    path: /data/apps/dreams/uploads/images
  audit:
    cron: "0 */10 * * * *"
